<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SafeMarket Simulator</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    label{display:block;margin-top:10px}
    input,select{width:300px;padding:6px}
    button{margin-top:12px;padding:8px 12px}
    pre{background:#f4f4f4;padding:10px}
  </style>
</head>
<body>
  <h2>SafeMarket - Simulador de Transacciones</h2>
  <form id="simForm">
    <label>amount
      <input type="number" step="0.01" id="amount" value="1200" />
    </label>
    <label>buyer_id
      <input id="buyer_id" value="buyer_1" />
    </label>
    <label>seller_id
      <input id="seller_id" value="seller_1" />
    </label>
    <label>currency
      <input id="currency" value="USD" />
    </label>
    <label>category
      <input id="category" value="ecommerce" />
    </label>
    <label>Use remote API?
      <select id="use_remote_api"><option value="false">No (local SDK)</option><option value="true">Yes (call backend /sdk/score)</option></select>
    </label>
    <button type="button" id="submit">Simular</button>
  </form>

  <h3>Resultado</h3>
  <pre id="result">-</pre>

  <script>
    async function postSim(){
      const body = {
        amount: parseFloat(document.getElementById('amount').value),
        buyer_id: document.getElementById('buyer_id').value,
        seller_id: document.getElementById('seller_id').value,
        currency: document.getElementById('currency').value,
        category: document.getElementById('category').value,
        use_remote_api: document.getElementById('use_remote_api').value === 'true'
      };
      const res = await fetch('/simulate/submit', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
    document.getElementById('submit').addEventListener('click', postSim);
  </script>
</body>
</html>
